# ==================== HUONG DAN CHAY PRODUCTION ====================
# Chay ung dung bang lenh:
# java -jar app.jar --spring.profiles.active=prod
#
# Hoac dat bien moi truong:
# SPRING_PROFILES_ACTIVE=prod
#
# Production yeu cau cac bien moi truong ben duoi.
# Khong su dung mat khau hoac JWT secret mac dinh.

# ==================== CAU HINH DATABASE ====================
# DB_URL: Dia chi ket noi den MySQL tren may chu production.
# DB_USERNAME: Ten tai khoan MySQL.
# DB_PASSWORD: Mat khau MySQL.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ==================== CAU HINH JWT ====================
# JWT_SECRET: Khoa bi mat rieng, du manh, khong dua len GitHub.
jwt.secret=${JWT_SECRET}

# ==================== DIA CHI WEBSITE ====================
# APP_BASE_URL: Dia chi HTTPS cong khai cua website.
app.base-url=${APP_BASE_URL}

# APP_ALLOWED_ORIGINS: Danh sach origin duoc phep ket noi.
# Neu co nhieu origin, phan tach bang dau phay.
app.allowed-origins=${APP_ALLOWED_ORIGINS}

# ==================== BAO MAT COOKIE ====================
# Chi bat khi website duoc phuc vu qua HTTPS.
app.cookie-secure=true
server.servlet.session.cookie.secure=true

# ==================== REVERSE PROXY ====================
# Su dung khi ung dung nam sau Nginx hoac proxy tuong duong.
server.forward-headers-strategy=framework

# ==================== JPA VA LOGGING ====================
# Khong hien thi cau lenh SQL trong log.
spring.jpa.show-sql=false

# Han che thong tin chi tiet tu Spring Security.
logging.level.org.springframework.security=WARN
logging.level.vn.utetra=INFO
logging.level.org.springframework.mail=WARN