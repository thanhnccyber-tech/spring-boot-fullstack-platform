# ==================== APP ====================
spring.application.name=SpringBootFull
server.port=8080
server.servlet.session.timeout=30m
server.servlet.context-path=/

# ==================== .env IMPORT ====================
spring.config.import=optional:file:.env[.properties]

# ==================== DATABASE ====================
spring.datasource.url=jdbc:mysql://localhost:3306/utetra_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=123456789
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ==================== JSP ====================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/

# ==================== MAIL ====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==================== CLOUDINARY ====================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ==================== JWT ====================
jwt.secret=${JWT_SECRET:utetraSecretKey2024ForJWTTokenGenerationMustBeAtLeast32BytesLong!!!}
jwt.expiration=86400000

# ==================== FILE UPLOAD ====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==================== REVIEW ====================
# true  = chỉ khách đã nhận hàng (đơn COMPLETED) mới được đánh giá
# false = khách đăng nhập nào cũng đánh giá được
review.require-purchase=false

# ==================== LOGGING ====================
logging.level.org.springframework.security=INFO
logging.level.vn.utetra=INFO
logging.level.org.springframework.mail=WARN

# ==================== BẢO MẬT ====================
# Đặt true khi chạy HTTPS (production) để cookie JWT chỉ gửi qua kết nối mã hoá
app.cookie-secure=false
# Chống dò mật khẩu: sai quá số lần này thì khoá tạm
security.max-attempts=5
security.lock-minutes=15
# Các origin khác domain được phép kết nối WebSocket (cùng domain luôn được phép)
app.allowed-origins=http://localhost:*,http://127.0.0.1:*
# Không để lộ chi tiết lỗi cho người dùng; dùng trang lỗi riêng (WEB-INF/views/error.jsp)
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never
# Cookie phiên (JSESSIONID) chỉ HTTP, không gửi chéo trang
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
