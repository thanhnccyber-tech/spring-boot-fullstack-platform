# ==================== THONG TIN UNG DUNG ====================
spring.application.name=SpringBootFull
server.port=8080
server.servlet.session.timeout=30m
server.servlet.context-path=/
# Nhan dien dung HTTPS/host cong khai khi chay sau reverse proxy nhu ngrok.
server.forward-headers-strategy=framework

# ==================== DOC FILE .env ====================
spring.config.import=optional:file:.env[.properties]

# ==================== CAU HINH DATABASE MYSQL ====================
spring.datasource.url=jdbc:mysql://localhost:3306/utetra_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ==================== CAU HINH JSP ====================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/

# ==================== CAU HINH EMAIL ====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==================== CAU HINH CLOUDINARY ====================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ==================== CAU HINH JWT ====================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ==================== GIOI HAN UPLOAD FILE ====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==================== CAU HINH DANH GIA SAN PHAM ====================
# true: Chi khach da nhan don hang COMPLETED moi duoc danh gia.
# false: Cho phep nguoi dung da dang nhap danh gia.
review.require-purchase=false

# ==================== CAU HINH GHI LOG ====================
# Khong hien thi SQL va han che thong tin nhay cam trong log.
logging.level.org.springframework.security=INFO
logging.level.vn.utetra=INFO
logging.level.org.springframework.mail=WARN

# ==================== BAO MAT UNG DUNG ====================
# Tao san tai khoan demo (admin@utetra.vn / manager / staff / shipper / user) voi mat khau mac dinh.
# CHI bat khi dev local (SEED_DEMO_ACCOUNTS=true trong .env). Tuyet doi khong bat tren server that.
app.seed-demo-accounts=${SEED_DEMO_ACCOUNTS:false}

# false: Dung khi phat trien tren localhost qua HTTP.
# Khi trien khai HTTPS, can bat true trong application-prod.properties.
app.cookie-secure=false

# So lan dang nhap sai toi da truoc khi tam khoa.
security.max-attempts=5
security.lock-minutes=5

# Cac origin duoc phep ket noi WebSocket khi chay local.
# Ma nguon WebSocket phai doc va ap dung thuoc tinh nay.
app.allowed-origins=http://localhost:*,http://127.0.0.1:*

# Tat trang loi mac dinh va khong de lo chi tiet loi cho nguoi dung.
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Bao ve cookie phien dang nhap.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ==================== CAU HINH CUA HANG ====================
# Phi giao hang co dinh, tinh bang dong Viet Nam.
# Don hang den lay tai cua hang duoc mien phi giao hang.
shop.shipping-fee=25000

# Mien phi giao hang khi tong tien hang dat nguong quy dinh.
# Gia tri 0 nghia la khong ap dung nguong mien phi theo tong tien.
shop.free-ship-from=0

# Phi giao hang theo khoang cach.
# Ap dung khi cua hang co toa do va khach su dung vi tri hien tai.
# Trong qua ship-base-km, moi km tiep theo cong them ship-per-km.
# Phi giao hang khong vuot qua ship-max-fee.
# Dat ship-per-km=0 neu khong muon tinh phi theo khoang cach.
shop.ship-base-km=3
shop.ship-per-km=5000
shop.ship-max-fee=60000

# Gia tri quy doi mot diem hoi vien khi dung de tru tien.
# Quy tac tich diem hien tai: 10.000 dong = 1 diem.
shop.point-value=200

# ==================== HANG HOI VIEN ====================
# So diem can dat de dat hang VIP va Diamond.
member.vip-points=400
member.diamond-points=1000

# ==================== DIA CHI WEBSITE ====================
# Dia chi cong khai cua website.
# Khi chay local, mac dinh la http://localhost:8080.
# Khi trien khai, dat APP_BASE_URL bang dia chi HTTPS that.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ==================== CAU HINH THANH TOAN VNPAY ====================
# De trong cac thong tin ma VNPAY neu chua su dung thanh toan VNPAY.
# Khi su dung, dang ky tai khoan sandbox va cau hinh cac gia tri trong .env.
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}

# ==================== CAU HINH THANH TOAN MOMO ====================
# De trong neu chua su dung MoMo; IPN can la URL cong khai co the truy cap tu MoMo.
momo.partner-code=${MOMO_PARTNER_CODE:}
momo.access-key=${MOMO_ACCESS_KEY:}
momo.secret-key=${MOMO_SECRET_KEY:}
momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
momo.ipn-url=${MOMO_IPN_URL:}

# ==================== MA HOA UTF-8 CHO TIENG VIET ====================
server.servlet.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
